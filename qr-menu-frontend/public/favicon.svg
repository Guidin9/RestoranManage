<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Mavi Liman kemer işareti — .login-arch / .menu-arch-shape motifi.
       Tarayıcı kabuğu koyu temadayken de okunsun diye gömülü media query. -->
  <style>
    .bg { fill: #eef2e6; }
    .arch { stroke: #12688a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #122a35; }
      .arch { stroke: #3f9dc2; }
    }
  </style>
  <rect class="bg" width="48" height="48" rx="11" />
  <path
    class="arch"
    d="M15 12v13a9 9 0 0 0 18 0V12"
    fill="none"
    stroke-width="3.4"
    stroke-linecap="round"
  />
</svg>

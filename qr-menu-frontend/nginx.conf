server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Yönlendirme react-router ile değil, App.jsx içinde window.location.pathname
    # ile yapılıyor. Bu yüzden /cashier, /waiter, /admin adresleri diskte dosya
    # olarak yoktur; hepsini index.html'e düşürmezsek doğrudan açıldıklarında 404 verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li asset dosyaları uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html önbelleğe alınmamalı, yoksa yeni derlemeler kullanıcıya ulaşmaz.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Kor palet işareti. Kemer motifi .login-arch'tan geliyor; müşteri
       menüsündeki .menu-arch-shape 2026-08-07 yeniden tasarımında kalktı,
       yani bu şekil artık yalnız giriş ekranıyla eşli.
       Tarayıcı kabuğu koyu temadayken de okunsun diye gömülü media query. -->
  <style>
    .bg { fill: #f5efe6; }
    .arch { stroke: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14100e; }
      .arch { stroke: #fb923c; }
    }
  </style>
  <rect class="bg" width="48" height="48" rx="11" />
  <path
    class="arch"
    d="M15 12v13a9 9 0 0 0 18 0V12"
    fill="none"
    stroke-width="3.4"
    stroke-linecap="round"
  />
</svg>

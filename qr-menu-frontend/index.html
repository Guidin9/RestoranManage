<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: başlık gradient'i çentik/durum çubuğu alanına
         taşsın diye. Karşılığında güvenli alan boşlukları index.css'te
         env(safe-area-inset-*) ile veriliyor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tarayıcı kabuğu sayfa zemininin üst durağıyla aynı renkte olsun
         (--page-grad'ın ilk durağı). Kabuk artık saydam cam, altındaki
         sayfa zemini görünüyor. -->
    <meta name="theme-color" content="#f5efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14100e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Masanızdaki QR kodu okutun, menüyü görün ve siparişinizi doğrudan verin." />
    <!-- Kor tasarım sistemi: tek aile, Inter (değişken, opsz + wght).
         index.css'teki @import yerine burada: @import zincirli bir istek
         (önce CSS inip parse edilmeli, sonra font istenir), <link> paralel gider.
         latin-ext alt kümesi Türkçe ş/ğ/İ/ı için şart — Google bunu
         unicode-range ile ayrı dosyada veriyor, ek istek maliyeti yok. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
    />
    <title>QR Menü</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
